<!DOCTYPE html><html lang='vi'><head><meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Danh sách bài học</title><style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
.dark-mode { background-color: #121212; color: #e0e0e0; }
.light-mode { background-color: #f8f9fa; color: #212529; }
.container { max-width: 900px; margin: auto; }
.header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
.btn { text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
.home-btn { background: #ffcc00; color: #121212; } .home-btn:hover { background: #e6b800; }
.theme-btn { background: #6c757d; color: white; } .theme-btn:hover { background: #5a6268; }
h1 { text-align: center; color: #3498db; margin: 15px 0; }
.progress-box { background: rgba(0,0,0,0.05); padding: 15px; border-radius: 10px; margin-bottom: 25px; text-align: center; }
.dark-mode .progress-box { background: #1e1e1e; }
.progress-bar-bg { background: #ccc; border-radius: 10px; height: 12px; width: 100%; overflow: hidden; margin-top: 8px; }
.progress-bar-fill { background: #2ecc71; height: 100%; width: 0%; transition: width 0.4s ease; }
.search-box { width: 100%; box-sizing: border-box; padding: 12px 18px; font-size: 16px; border-radius: 8px; border: 2px solid #ccc; margin-bottom: 20px; outline: none; }
.dark-mode .search-box { background: #222; border-color: #444; color: #fff; }
ul { list-style: none; padding: 0; }
li { margin: 8px 0; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 8px; transition: 0.2s; background: rgba(0,0,0,0.02); }
.dark-mode li { background: #1c1c1c; }
li:hover { transform: translateX(5px); }
a.lesson-link { text-decoration: none; font-size: 17px; font-weight: 500; flex-grow: 1; color: #007bff; }
.dark-mode a.lesson-link { color: #58a6ff; }
.badge-done { background: #2ecc71; color: white; font-size: 12px; padding: 4px 8px; border-radius: 12px; display: none; }
</style></head><body onload='initPage()'>
<div class='container'>
<div class='header-bar'>
<a class='btn home-btn' href='../../index.html'>🏠 Về Trang Chủ</a>
<button class='btn theme-btn' onclick='toggleTheme()'>🌓 Đổi Giao Diện</button>
</div>
<h1>📖 Danh sách bài học</h1>
<div class='progress-box'>
<div><b>Tiến độ học tập:</b> <span id='progress-text'>Đang tải...</span></div>
<div class='progress-bar-bg'><div id='progress-fill' class='progress-bar-fill'></div></div>
</div>
<input type='text' id='searchInput' class='search-box' placeholder='🔍 Gõ để tìm nhanh bài học...' onkeyup='filterLessons()'>
<ul id='lessonList'>
<li data-title='lesson 1 -- khái niệm cơ bản -//'>
<a class='lesson-link' href='https://marucho2020.github.io/Learning/pages/Kotlin/lessons/lesson1.html'>Lesson 1 -- Khái niệm cơ bản -//</a>
<span class='badge-done' id='badge_kotlin-learning-list_lesson1.html'>✓ Đã học</span>
</li>
<li data-title='lesson 2 -- cú pháp và các tính năng quan trọng của kotlin -//'>
<a class='lesson-link' href='https://marucho2020.github.io/Learning/pages/Kotlin/lessons/lesson2.html'>Lesson 2 -- Cú pháp và các tính năng quan trọng của Kotlin -//</a>
<span class='badge-done' id='badge_kotlin-learning-list_lesson2.html'>✓ Đã học</span>
</li>
<li data-title='lesson 3 -- các cú pháp kotlin -//'>
<a class='lesson-link' href='https://marucho2020.github.io/Learning/pages/Kotlin/lessons/lesson3.html'>Lesson 3 -- Các cú pháp Kotlin -//</a>
<span class='badge-done' id='badge_kotlin-learning-list_lesson3.html'>✓ Đã học</span>
</li>
</ul></div>
<script>
const topicId = 'kotlin-learning-list';
const totalLessons = 3;
function updateProgress() {
  let doneCount = 0;
  document.querySelectorAll('li').forEach(li => {
    const link = li.querySelector('a');
    const fileName = link.getAttribute('href').split('/').pop();
    const key = topicId + '_' + fileName;
    const badge = document.getElementById('badge_' + key);
    if (localStorage.getItem(key) === 'done') {
      doneCount++;
      if(badge) badge.style.display = 'inline-block';
    } else {
      if(badge) badge.style.display = 'none';
    }
  });
  const percent = totalLessons > 0 ? Math.round((doneCount / totalLessons) * 100) : 0;
  document.getElementById('progress-text').innerText = doneCount + '/' + totalLessons + ' bài (' + percent + '%)';
  document.getElementById('progress-fill').style.width = percent + '%';
}
function filterLessons() {
  let input = document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('#lessonList li').forEach(li => {
    let title = li.getAttribute('data-title');
    li.style.display = title.includes(input) ? 'flex' : 'none';
  });
}
function toggleTheme() {
  let mode = document.body.classList.contains('dark-mode') ? 'light-mode' : 'dark-mode';
  document.body.className = mode;
  localStorage.setItem('theme', mode);
}
function initPage() {
  document.body.className = localStorage.getItem('theme') || 'dark-mode';
  updateProgress();
}
</script></body></html>
